name: tdmpc2
channels:
  - pytorch-nightly
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - glew=2.2.0
  - glib=2.78.4
  - python=3.9
  - pytorch=2.6.0.dev20241112
  - pytorch-cuda=12.4
  - torchvision=0.15.2
  # PyTorch nightly 2024-11 builds can fail to import with newer MKL runtimes:
  # libtorch_cpu.so: undefined symbol: iJIT_NotifyEvent
  - mkl=2023.1.0
  - intel-openmp=2023.1.0
  - pip=24.0
  - pip:
      # ── RL framework ──────────────────────────────────────────────
      - tensordict==0.6.0
      - torchrl==0.6.0
      - gymnasium==0.29.1

      # ── World model / planning ────────────────────────────────────
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
      - submitit==1.5.1
      - omegaconf==2.3.0

      # ── SUMO interface ────────────────────────────────────────────
      # traci and sumolib are bundled with SUMO (see note below).
      # If SUMO is installed via pip instead of system package:
      # - traci
      # - sumolib
      - lxml

      # ── MuJoCo / DMControl (optional, for non-SUMO tasks) ────────
      - mujoco==3.1.2
      - dm-control==1.0.16
      - glfw==2.7.0

      # ── Numerics & data ──────────────────────────────────────────
      - numpy==1.24.4
      - scipy==1.13.1
      - pandas==2.0.3

      # ── Visualization & logging ──────────────────────────────────
      - matplotlib==3.9.4
      - termcolor==2.4.0
      - tqdm==4.66.4
      - wandb==0.17.4

      # ── Video recording ──────────────────────────────────────────
      - ffmpeg==1.4
      - imageio==2.34.1
      - imageio-ffmpeg==0.4.9
      - moviepy==1.0.3

      # ── Misc ─────────────────────────────────────────────────────
      - kornia==0.7.2
      - h5py==3.11.0

# ══════════════════════════════════════════════════════════════════════
# SUMO Installation (required, NOT managed by conda)
# ══════════════════════════════════════════════════════════════════════
# This project requires Eclipse SUMO >= 1.14.0 (tested with 1.24.0).
# SUMO must be installed separately and the SUMO_HOME environment
# variable must be set before running.
#
# macOS (Homebrew):
#   brew install sumo
#   export SUMO_HOME=$(brew --prefix sumo)/share/sumo
#
# Ubuntu/Debian:
#   sudo add-apt-repository ppa:sumo/stable
#   sudo apt-get update && sudo apt-get install sumo sumo-tools
#   export SUMO_HOME=/usr/share/sumo
#
# Verify:
#   sumo --version        # should print >= 1.14.0
#   python -c "import traci; print('OK')"
#
# ══════════════════════════════════════════════════════════════════════
# Quick start:
#   conda env create -f environment.yaml
#   conda activate tdmpc2
#   cd envs/sumo_files && bash build_network.sh && cd ../..
#   python test_env.py --mock      # shape check (no SUMO needed)
#   python test_env.py             # real SUMO rollout
#   python train.py task=sumo-intersection
# ══════════════════════════════════════════════════════════════════════
